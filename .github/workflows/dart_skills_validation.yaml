name: dart_skills_validation
permissions: read-all

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'repo_tool/**'
      - '.github/workflows/dart_skills_validation.yaml'
  push:
    branches: [ main ]
    paths:
      - 'skills/**'
      - 'repo_tool/**'
      - '.github/workflows/dart_skills_validation.yaml'
  schedule:
    - cron: '0 0 * * 0' # weekly

jobs:
  analyze_and_test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

    - name: Setup Dart
      uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.1

    - name: Install dependencies
      run: dart pub get
      working-directory: repo_tool

    - name: Verify formatting across repository
      run: dart format --output=none --set-exit-if-changed .

    - name: Analyze project source and skills
      run: dart analyze --fatal-infos --packages=repo_tool/.dart_tool/package_config.json repo_tool skills

    - name: Run tests
      run: dart test
      working-directory: repo_tool

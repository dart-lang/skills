- name: dart-generate-test-mocks
  description: Define and generate mock objects for external dependencies using
    `package:mockito` and `build_runner`. Use when unit testing classes that
    depend on complex external services like APIs or databases.
  instructions: |
    1. **Understand Mocking with `package:mockito`**: `package:mockito` provides a way to create mock objects that can be easily configured for fixed scenarios. It also allows verification that the system under test interacts with the mock object in expected ways. An example using both `package:test` and `package:mockito` can be found in the International Space Station API library and its unit tests within the `mockito` package.
    2. **Utilize `build_runner`**: `build_runner` is a command-line tool that can be used for various tasks, including code generation.
    3. **Define Dependencies**: When dealing with external services like APIs or databases, you might need to fetch data from the internet. This often involves using packages like `package:http`. To add `package:http` as a dependency, you would run `dart pub add http`. You would then import it into your code, optionally with a library prefix like `import 'package:http/http.dart' as http;`. URLs are represented by `Uri` objects in Dart, and `Uri.parse` is a common way to create them from a string.
    4. **Structure Your Code for Testing**: Dart is an object-oriented language with classes and mixin-based inheritance. Every object is an instance of a class, and all classes except `Null` descend from `Object`. Classes have members, including functions (methods) and data (instance variables). You can define instance variables within a class.
    5. **Generate Mocks**: The `build_runner` tool will be used to generate the mock objects based on your definitions.
    6. **Integrate Mocks into Unit Tests**: Use the generated mock objects in your unit tests to isolate the class being tested from its complex external dependencies. `package:test` provides a standard way of writing tests in Dart, allowing you to write single tests or groups of tests, asynchronous tests, and tag tests.
    7. Run tests and ensure that they pass.


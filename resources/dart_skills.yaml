- name: dart-use-pattern-matching
  description: Use switch expressions and pattern matching where appropriate
  instructions: |
    1.  **Identify Scenarios for Pattern Matching:**
        *   Determine if you need to test a value to see if it has an expected form.
        *   Consider situations where you want to destructure an object and extract its data into parts.
        *   Look for operations that require specific behavior for each type, especially when grouping that behavior in one place rather than spreading it across type definitions.
        *   Evaluate if you need to validate incoming data, such as deserialized JSON, where map and list patterns can be used for destructuring key-value pairs.
        *   Consider using patterns in local variable declarations and assignments, `for` and `for-in` loops, `if-case` statements, and control flow in collection literals.

    2.  **Choose Between Switch Statements and Switch Expressions:**
        *   If you need to produce a value based on which case matches, use a switch expression. Switch expressions can be used wherever Dart allows expressions, except at the start of an expression statement.
        *   If you want to use a switch at the start of an expression statement, use a switch statement.
        *   Switch expressions offer a more concise way to rewrite switch statements, where case bodies are single expressions and cases are separated from their bodies using `=>` instead of `:`.
        *   Switch statements and expressions both allow any kind of pattern in their case clauses.

    3.  **Define Case Patterns:**
        *   **Constant Patterns:** Match if the value is equal to a constant.
        *   **Logical-or Patterns (`||`):** Allow multiple cases to share a body or a guard in switch expressions or statements.
        *   **Relational and Logical-and Patterns (`>=`, `<=`, `&&`):** Match if a value falls within a specified range.
        *   **Record Patterns:** Match if an object is a record with specific fields, and can assign those fields to variables.
        *   **List Patterns:** Match if an object is a list with a certain number of fields, and can match against subpatterns within those fields.
        *   **Map Patterns:** Useful for destructuring key-value pairs in deserialized data.
        *   **Variable Patterns:** Declare new local variables when a pattern matches and destructures a value.
        *   **Wildcard Patterns (`_`):** Use as a placeholder to ignore parts of a matched value. In list patterns, a rest element can also be used.
        *   **Null-check Patterns (`?`):** Treat null values as match failures without throwing, making the matched variable non-nullable.
        *   **Null-assert Patterns (`!`):** Match if the object is not null, permitting non-null values to flow through but throwing if the matched value is null.
        *   **Parenthesized Patterns:** Control pattern precedence.

    4.  **Implement Case Bodies:**
        *   For switch expressions, each case must have a single expression as its body, and there is no implicit fallthrough for empty cases.
        *   For switch statements, empty cases can fall through to the next case, allowing cases to share a body. `break` can be used for an empty case that does not fall through, and `continue` with a label can be used for non-sequential fall-through.

    5.  **Add Guard Clauses (Optional):**
        *   Use the `when` keyword to set an optional guard clause after a case clause in both switch statements and expressions.
        *   Guard clauses evaluate an arbitrary condition as part of a case without exiting the switch if the condition is false.

    6.  **Handle Unmatched Cases:**
        *   Use a `default` or wildcard `_` clause to execute code when no other case clause matches.

    7.  **Enable Exhaustiveness Checking (for Sealed Classes):**
        *   Apply the `sealed` modifier to a class to enable exhaustiveness checking when switching over its subtypes. This will inform you if a new subclass is added and the switch expression is incomplete.

    8.  **Destructure and Assign Variables:**
        *   When a pattern matches, it can destructure the value and bind it to new local variables.
        *   Use a variable assignment pattern on the left side of an assignment to destructure an object and assign values to existing variables instead of binding new ones. This can be used to swap variable values.
  resources:
    - https://raw.githubusercontent.com/dart-lang/language/refs/heads/main/accepted/3.0/patterns/feature-specification.md
    - https://dart.dev/language/collections
    - https://dart.dev/language/pattern-types
    - https://dart.dev/language/patterns
- name: dart-run-static-analysis
  description: Execute `dart analyze` to identify warnings and errors, and use
   `dart fix --apply` to automatically resolve mechanical lint issues. Use during
    development to ensure code quality and before committing changes.
  instructions: |
    1.  **Analyze the project's Dart source code**:
        *   Use the `dart analyze` command to perform static analysis.
        *   You can run `dart analyze` over all Dart files in the current directory.
        *   Alternatively, you can specify a directory or a single Dart file as an argument, for example, `dart analyze bin`.
        *   The `dart analyze` command is available whether you download the Dart SDK explicitly or only the Flutter SDK.
        *   The analyzer uses the `analyzer` package to perform static analysis and can be customized to look for various potential problems, including errors and warnings specified in the Dart language spec.
        *   It can also configure linter rules to ensure code complies with the Dart Style Guide and Effective Dart guidelines.
        *   By default, the analyzer reports failure for errors or warnings, but not for info-level issues. This behavior can be customized using flags like `--fatal-infos` and `--no-fatal-warnings`.
        *   Analyzer plugins can extend the Dart analyzer to report custom diagnostics (lints and warnings), offer quick fixes, and provide assists. These plugins are available in your IDE and when running `dart analyze` or `flutter analyze`.
        *   You can enable an analyzer plugin by adding it to the `plugins` section of your `analysis_options.yaml` file.
        *   Static analysis helps reveal type-related bugs at compile time that might be tricky to find at runtime. It also contributes to more readable and maintainable code, and better ahead-of-time (AOT) compilation.

    2.  **Apply automated fixes to Dart source code**:
        *   Use the `dart fix` command to apply automated fixes.
        *   To apply the proposed changes, use the `--apply` flag: `dart fix --apply`.
        *   To preview proposed changes without applying them, use the `--dry-run` flag: `dart fix --dry-run`.
        *   `dart fix` applies fixes when a "problem" is identified by a diagnostic.
        *   Some diagnostics, like compilation errors, are implicitly enabled, while others, such as lints, must be explicitly enabled in the `analysis_options.yaml` file.
        *   Enabling additional lints can sometimes increase the number of fixes that can be applied.
        *   Not all diagnostics have associated fixes.
        *   `dart fix` can be used to resolve outdated API usages when updating to newer Dart and Flutter SDKs.
        *   For example, in Dart 3 migration, `dart fix --apply --code=obsolete_colon_for_default_value` can automate the migration of colon-syntax for default values to the equals syntax.
        *   Quick fixes, which are automated edits to resolve issues reported by linter rules, can be applied using `dart fix` or an editor with Dart support.

    3.  **Customize static analysis (optional)**:
        *   You can customize the behavior of the analyzer using an `analysis_options.yaml` file or comments in Dart source code.
        *   Place the `analysis_options.yaml` file at the root of the package, in the same directory as the `pubspec` file.
        *   To exclude files from static analysis, use the `exclude:` analyzer option in `analysis_options.yaml`, listing individual files or using glob patterns.
        *   To ignore a specific non-error diagnostic for a file, add an `// ignore_for_file:` comment to the file, for example, `// ignore_for_file: unused_local_variable`. This comment acts for the whole file.
        *   To suppress a diagnostic for a single line, you can use `// ignore: some_plugin/some_code`.
        *   To suppress a diagnostic for an entire file, you can use `// ignore_for_file: some_plugin/some_code`.
        *   You can also disable specific rules for all files or change the severity of rules.
        *   To prevent implicit downcasts from `dynamic` and avoid runtime `TypeError` issues, consider enabling the analyzer's strict casts mode in `analysis_options.yaml` by setting `analyzer: language: strict-casts: true`.

- name: dart-effective-style
  description: Maintain code consistency by following official Dart style and naming conventions.
  instructions: |
    - Always name types (classes, enums, typedefs) using UpperCamelCase.
    - Always name members and variables using lowerCamelCase.
    - Consistency with existing code is prioritized, but official guidelines should lead.
    - Run `dart format` as a mandatory step before committing code.
    - Prefer relative imports for files located inside the `lib` directory of the same package.
    - Use `_` for unused callback parameters.
  resources:
    - https://dart.dev/effective-dart/style.html#naming
    - https://dart.dev/effective-dart/style.html#formatting

- name: dart-documentation
  description: Use idiomatic doc comments to provide a professional API surface.
  instructions: |
    - Use `///` exclusively for doc comments (avoid `/**`).
    - Begin the first sentence with a brief, third-person singular summary.
    - Place the summary on its own line for better readability in IDE tooltips.
    - Use square brackets `[]` to link to types, methods, or variables in scope.
    - Provide concise code examples for complex logic using markdown blocks.
    - Verify generated docs using `dart doc --validate-links`.
  resources:
    - https://dart.dev/effective-dart/documentation.html#doc-comments
    - https://dart.dev/tools/dart-doc.html

- name: dart-static-analysis
  description: Configure and resolve static analysis warnings to maintain project health.
  instructions: |
    - Run `dart analyze` to catch potential bugs and style violations early.
    - Configure custom lint rules in `analysis_options.yaml` (prefer using `package:lints`).
    - Resolve "non-promotion" reasons by using local variables for field promotion.
    - Use `dart fix --apply` for bulk-fixing common lint and migration issues.
    - Avoid ignoring lints manually unless absolutely necessary; prefer fixing the root cause.
  resources:
    - https://dart.dev/tools/analysis.html#customizing-static-analysis
    - https://dart.dev/tools/linter-rules/index.html
    - https://dart.dev/tools/non-promotion-reasons.html

- name: dart-language-syntax
  description: Master core and advanced language syntax for expressive and type-safe code.
  instructions: |
    - Prefer `var` for local variables with obvious types; use explicit types otherwise.
    - Use `final` for variables that should not be reassigned.
    - Master pattern matching (destructuring) in assignments and switch statements.
    - Use records `(...)` for returning multiple values without defining a class.
    - Implement generics `<T>` to ensure type safety in reusable components.
    - Use extension methods and types to add functionality to existing classes.
  resources:
    - https://dart.dev/language/variables.html
    - https://dart.dev/language/functions.html
    - https://dart.dev/language/patterns/index.html
    - https://dart.dev/language/records/index.html
    - https://dart.dev/language/generics/index.html

- name: dart-idiomatic-usage
  description: Apply Effective Dart usage patterns for cleaner and more efficient code.
  instructions: |
    - Use collection literals (e.g., `[]`, `{}`) instead of constructors.
    - Use `.isEmpty` and `.isNotEmpty` instead of checking length against zero.
    - Use the spread operator `...` and collection-if/for for dynamic lists.
    - Avoid `cast()` when possible; prefer `Map.from()` or similar conversions.
    - Use string interpolation `$variable` instead of concatenation.
  resources:
    - https://dart.dev/effective-dart/usage/index.html#collections
    - https://dart.dev/effective-dart/usage/index.html#strings

- name: dart-async-programming
  description: Handle asynchronous operations safely using Futures and Streams.
  instructions: |
    - Always use `async`/`await` instead of raw `.then()` calls for better readability.
    - Wrap asynchronous calls in `try-catch` to handle errors gracefully.
    - Use `Future.wait` to initiate multiple independent futures concurrently.
    - Prefer `await for` when consuming streams if appropriate.
    - Use `StreamController` with a `close()` call to prevent memory leaks.
  resources:
    - https://dart.dev/language/async.html
    - https://dart.dev/libraries/async/async-await.html
    - https://dart.dev/libraries/async/using-streams.html

- name: dart-concurrency-isolates
  description: Offload heavy computation to isolates to keep the main thread responsive.
  instructions: |
    - Use `Isolate.run()` for simple one-off background tasks.
    - Manually manage `SendPort` and `ReceivePort` for complex, long-running background workers.
    - Avoid passing large mutable objects between isolates; prefer simple data types.
    - Ensure isolates are terminated when no longer needed to free resources.
  resources:
    - https://dart.dev/language/isolates.html
    - https://dart.dev/language/concurrency.html

- name: dart-package-management
  description: Structure packages and manage dependencies using the pub ecosystem.
  instructions: |
    - Maintain a valid `pubspec.yaml` with clear version constraints (prefer `^`).
    - Follow the "lib/" directory convention for public exports.
    - Use `dart pub get` and `dart pub upgrade` to manage the `package_config.json`.
    - Implement workspaces in monorepos to share dependencies across local packages.
    - Ensure all public assets are listed correctly in the pubspec.
  resources:
    - https://dart.dev/tools/pub/pubspec.html
    - https://dart.dev/tools/pub/package-layout.html
    - https://dart.dev/tools/pub/workspaces.html

- name: dart-testing
  description: Ensure code correctness with comprehensive unit and integration tests.
  instructions: |
    - Write tests using the `test` package with descriptive group and test names.
    - Use `expect()` with appropriate matchers (e.g., `completion`, `throwsA`).
    - Run tests via `dart test` and use flags for specific directories or tags.
    - Use mock objects or fakes to isolate the system under test.
  resources:
    - https://dart.dev/tools/testing.html

- name: dart-compilation-deployment
  description: Compile and deploy Dart apps for various native and web target platforms.
  instructions: |
    - Use `dart compile exe` for self-contained native binaries on Windows/macOS/Linux.
    - Use `dart compile js` or `dart compile wasm` for web deployment targets.
    - Optimize for performance using AOT compilation where supported.
    - Use `dartaotruntime` for running AOT snapshots in resource-constrained environments.
  resources:
    - https://dart.dev/tools/dart-compile.html
    - https://dart.dev/tools/dartaotruntime.html

- name: dart-web-development
  description: Build high-performance web apps using modern interop and browser APIs.
  instructions: |
    - Always prefer `package:web` over legacy `dart:html`.
    - Use `dart:js_interop` with `@JS` annotations for external library calls.
    - Avoid using `dart:mirrors` in web applications (not supported).
    - Use `webdev serve` for a development environment with hot reload.
  resources:
    - https://dart.dev/interop/js-interop/index.html
    - https://dart.dev/tools/webdev.html

- name: dart-native-interop-ffi
  description: Bridge Dart with native C/C++ libraries using FFI.
  instructions: |
    - Use `package:ffigen` to automate the generation of FFI bindings.
    - Manually allocate and free memory using `calloc` or `malloc` if required.
    - Use `Finalizable` and `NativeFinalizer` to ensure native resources are cleaned up.
    - Prefer `abiSpecificInteger` for cross-platform type mapping.
  resources:
    - https://dart.dev/interop/c-interop/index.html

- name: dart-code-generation
  description: Automate repetitive code tasks using the build_runner system.
  instructions: |
    - Run `dart run build_runner build --delete-conflicting-outputs` to resolve build issues.
    - Use `watch` for continuous background generation during development.
    - Avoid committing `.g.dart` files if the project policy is to generate them on-the-fly.
  resources:
    - https://dart.dev/tools/build_runner.html

- name: dart-migration-versioning
  description: Manage language versioning and perform large-scale codebase upgrades.
  instructions: |
    - Check current language version requirements in `pubspec.yaml`.
    - Use `@dart = <version>` to pin specific files to older versions during migration.
    - Consult breaking change logs before performing major dependency upgrades.
  resources:
    - https://dart.dev/language/versioning.html
    - https://dart.dev/resources/breaking-changes.html

- name: dart-api-design
  description: Apply design principles to create intuitive and robust library interfaces.
  instructions: |
    - Prefer named parameters for functions with more than two arguments.
    - Use type aliases (typedefs) to simplify complex function signatures.
    - Avoid public fields; use getters and setters for encapsulation.
    - Design for extension by using appropriate class modifiers (`interface`, `base`).
  resources:
    - https://dart.dev/effective-dart/design.html#naming
    - https://dart.dev/language/class-modifiers.html

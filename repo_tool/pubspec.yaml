name: repo_tool
description: Repo tooling to help validate dart skills.
version: 1.0.0

environment:
  sdk: ^3.11.6

dependencies:
  path: ^1.9.0

dev_dependencies:
  # Dependencies required by repo_tool and for static analysis / linting
  # of Dart code snippets and examples across the skills/ directory.
  args: ^2.5.0
  cli_util: ^0.6.0
  io: ^1.0.4
  lints: ^6.0.0
  logging: ^1.2.0
  skills_lint: ^0.5.1
  stack_trace: ^1.12.0
  test: ^1.25.6
